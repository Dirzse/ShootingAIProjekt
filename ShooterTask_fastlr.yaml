behaviors:
  ShooterTask:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 10240
      learning_rate: 1.0e-3
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000

# Két fázis: előbb csak zónák, aztán ellenségekkel.
# Akkor vált, ha az átlagos epizód-jutalom tartósan eléri a threshold-ot.
environment_parameters:
  spawn_enemies:
    curriculum:
      - name: ZonesOnly
        completion_criteria:
          measure: reward
          behavior: ShooterTask
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 5.0
        value: 0.0
      - name: WithEnemies
        value: 1.0
